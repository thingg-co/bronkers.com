<script src="../js/theme-switcher.js"></script>
<script src="../js/main.js"></script>
<script type="module">
// architecture.md stays the single source of truth; this page renders it.
try {
    const [{ marked }, res] = await Promise.all([
        import("https://esm.sh/marked@14.1.2"),
        fetch("architecture.md"),
    ]);
    if (!res.ok) throw new Error(`fetch failed: ${res.status}`);
    const md = await res.text();
    document.getElementById("doc").innerHTML = marked.parse(md);
    // mermaid blocks: marked emits <pre><code class="language-mermaid">
    const blocks = [...document.querySelectorAll("code.language-mermaid")];
    if (blocks.length) {
        const { default: mermaid } = await import("https://esm.sh/mermaid@11");
        blocks.forEach((c) => {
            const div = document.createElement("div");
            div.className = "mermaid";
            div.textContent = c.textContent;
            c.closest("pre").replaceWith(div);
        });
        const dark = document.documentElement.getAttribute("data-theme") === "dark";
        mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral" });
        await mermaid.run();
    }
} catch (err) {
    document.querySelector(".doc-fallback").innerHTML =
        `Couldn't render the document here (${err.message}). Read the raw <a href="architecture.md">architecture.md</a> instead.`;
}
</script>
</body>
